name: Reconstruct DataPEA missing files

on:
  push:
    branches: [main]
    paths:
      - ".upload/READY"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/xz_parts/part_* > /tmp/github_missing_files.tar.xz.b64
          base64 -d /tmp/github_missing_files.tar.xz.b64 > /tmp/github_missing_files.tar.xz

          echo "2c8716a0274ab7e386e720c2e57380ef49e643a6d768f431e43f546810d76d17  /tmp/github_missing_files.tar.xz" | sha256sum -c -

          tar -xJf /tmp/github_missing_files.tar.xz -C .

          echo "6ec2f11a656de97e860165df12ad5e346c9e1dee0b04c03301e4cacf024a9ecc  Graphplot_webserv_v4_4_5.py" | sha256sum -c -
          echo "429adf25b6a932caa77b42bd95d63b1064edbc093bd77b19536d49b887d0c2b6  launcher_helper.py" | sha256sum -c -
          echo "2245c38c0a3702cd7e35de0aedd23f9e5f8d05d7258a6aa12a165e0687aa5c1e  VERSION_HISTORY.md" | sha256sum -c -

          python -m py_compile Graphplot_webserv_v4_4_5.py launcher_helper.py

      - name: Commit reconstructed project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Graphplot_webserv_v4_4_5.py launcher_helper.py VERSION_HISTORY.md
          git rm -r .upload
          git rm .github/workflows/reconstruct-missing.yml

          git commit -m "Complete Python-DataPEA V4.4.5 project files"
          git push origin main
